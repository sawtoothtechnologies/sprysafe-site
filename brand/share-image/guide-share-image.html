<!doctype html>
<!--
  Share image for one guide (Signal Amber v1.1). Same ink, light, font and Open Ring as
  share-image.html, with the guide's title large in the middle and one simple line icon.
  Render with render-guide.py; see README.md. The title and icon are filled in by the
  script from the query string (?title=...&icon=envelope).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ScamPrep guide share image</title>
<style>
  @font-face { font-family: 'Manrope'; font-weight: 700; src: url('fonts/manrope-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 800; src: url('fonts/manrope-latin-800-normal.woff2') format('woff2'); }
  :root { --ink: #121110; --paper: #f8f7f4; --amber: #f0a11c; --gray-400: #a3a09a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: 'Manrope', system-ui, sans-serif; color: var(--paper); -webkit-font-smoothing: antialiased; }
  .light {
    position: absolute; left: 1290px; top: 330px; width: 1500px; height: 1300px; margin: -650px 0 0 -750px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(246,178,62,0.34) 0%, rgba(240,161,28,0.20) 28%, rgba(240,161,28,0.08) 58%, rgba(240,161,28,0) 100%);
  }
  .frame { position: relative; height: 100%; padding: 64px 84px 60px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 40px; height: 40px; color: var(--paper); }
  .brand span { font-weight: 800; font-size: 36px; letter-spacing: -0.03em; line-height: 1; padding-bottom: 2px; }
  .brand small { margin-left: 10px; font-weight: 700; font-size: 24px; color: var(--amber); letter-spacing: -0.01em; }
  .main { flex: 1; display: flex; align-items: center; gap: 56px; }
  .title { flex: 1; font-weight: 800; font-size: 68px; line-height: 1.08; letter-spacing: -0.028em; max-width: 820px; }
  .icon { width: 190px; height: 190px; flex: none; color: var(--paper); }
  .icon svg { width: 100%; height: 100%; }
  .foot { font-weight: 700; font-size: 26px; color: var(--amber); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="light" aria-hidden="true"></div>
  <div class="frame">
    <div class="brand">
      <svg viewBox="10 10 76 76" fill="none" aria-hidden="true">
        <path d="M 57.02 19.39 A 30 30 0 1 0 76.61 38.98" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" />
        <circle cx="48" cy="48" r="11" fill="#f0a11c" />
      </svg>
      <span>ScamPrep</span>
      <small>Guide</small>
    </div>
    <div class="main">
      <h1 class="title" id="title">Guide title</h1>
      <div class="icon" id="icon"></div>
    </div>
    <p class="foot">getscamprep.com</p>
  </div>
  <script>
    // Icons drawn in the site's line style (ink outline, 1.8 stroke in a 24 grid), paper on ink here.
    const ICONS = {
      envelope: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/><circle cx="18.6" cy="6.4" r="2.2" fill="#f0a11c" stroke="none"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
      bubble: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H9l-5 4z"/></svg>'
    };
    const q = new URLSearchParams(location.search);
    document.getElementById('title').textContent = q.get('title') || 'Guide title';
    document.getElementById('icon').innerHTML = ICONS[q.get('icon')] || '';
    const size = q.get('size'); if (size) document.getElementById('title').style.fontSize = size + 'px';
  </script>
</body>
</html>
