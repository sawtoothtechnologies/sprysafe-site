<!doctype html>
<!--
  ScamPrep share image (Signal Amber v1.1): the Open Ring lockup and the tagline.
  One image for every page. Capture at exactly 1200 x 630 -> public/og-v3.png.
  See brand/share-image/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ScamPrep share image</title>
<style>
  @font-face { font-family: 'Manrope'; font-weight: 700; src: url('fonts/manrope-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 800; src: url('fonts/manrope-latin-800-normal.woff2') format('woff2'); }

  :root {
    --ink: #121110;
    --paper: #f8f7f4;
    --amber: #f0a11c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body {
    position: relative;
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  /* The hero's warm light, softened: its center sits just past the right edge,
     so it comes in gently from the side rather than making a spot on the page. */
  .light {
    position: absolute;
    left: 1290px; top: 330px;
    width: 1500px; height: 1300px;
    margin: -650px 0 0 -750px;
    border-radius: 50%;
    background: radial-gradient(
      closest-side,
      rgba(246, 178, 62, 0.34) 0%,
      rgba(240, 161, 28, 0.20) 28%,
      rgba(240, 161, 28, 0.08) 58%,
      rgba(240, 161, 28, 0) 100%
    );
  }

  /* Centered, so square crops (WhatsApp, some iMessage views) keep everything. */
  .frame {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 6px;
  }

  .logo { display: flex; align-items: center; gap: 30px; }
  .logo svg { width: 132px; height: 132px; color: var(--paper); }
  .logo span { font-weight: 800; font-size: 118px; letter-spacing: -0.03em; line-height: 1; padding-bottom: 6px; }

  .tag {
    margin-top: 44px;
    font-weight: 700;
    font-size: 46px;
    letter-spacing: -0.015em;
    color: var(--amber);
  }
</style>
</head>
<body>
  <div class="light" aria-hidden="true"></div>
  <div class="frame">
    <div class="logo">
      <!-- The Open Ring: paper ring on ink, amber center. -->
      <svg viewBox="10 10 76 76" fill="none" aria-hidden="true">
        <path d="M 57.02 19.39 A 30 30 0 1 0 76.61 38.98" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" />
        <circle cx="48" cy="48" r="11" fill="#f0a11c" />
      </svg>
      <span>ScamPrep</span>
    </div>
    <p class="tag">Pamphlets fade. Practice sticks.</p>
  </div>
</body>
</html>
